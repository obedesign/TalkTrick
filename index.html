<style id="talktrick-camera-functionality-fix">
.tt-camera-fullscreen .tt-camera-stage{aspect-ratio:9/16;max-height:58vh;overflow:hidden;border-radius:18px;background:#000;flex:1 1 auto!important;min-height:180px!important}
.tt-camera-fullscreen [data-live-camera]{width:100%;height:100%;max-height:none!important;object-fit:cover;border-radius:18px;background:#000;transition:filter .12s ease}
.tt-camera-top-tools{position:absolute;left:8px;top:8px;z-index:5;display:flex;gap:6px;max-width:calc(100% - 55px)}
.tt-camera-tool,.tt-camera-chip{background:#17171dcc;color:#fff;border:1px solid #ffffff35;border-radius:18px;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.tt-camera-effects{display:flex;flex-direction:row;gap:0;flex:0 0 auto;max-width:100%;overflow:hidden}
.tt-camera-effect-row{display:flex;align-items:center;gap:0;min-width:0;color:#ddd;font-size:10px;width:100%}
.tt-camera-effect-row>span{display:none}
.tt-camera-effect-row>div{display:flex;gap:6px;overflow-x:auto;min-width:0;width:100%;padding:4px 2px;scrollbar-width:none}
.tt-camera-chip{padding:6px 9px;background:#ffffff18;flex:0 0 auto}
.tt-camera-chip.active{background:#7c3aed;border-color:#c4b5fd}
.tt-camera-fullscreen .tt-camera-bottom{gap:12px;padding:5px 0}
.tt-camera-fullscreen .tt-camera-shutter{flex:0 0 66px;width:66px;height:66px}
.tt-camera-fullscreen .tt-camera-small{width:42px;height:42px;flex:0 0 42px}
.tt-effect-vhs:after,.tt-effect-glitch:after,.tt-effect-grain:after,.tt-effect-vignette:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:18px}
.tt-effect-vhs:after{background:repeating-linear-gradient(0deg,#0000 0 4px,#0005 5px);mix-blend-mode:screen}
.tt-effect-glitch:after{background:linear-gradient(90deg,#f04a5c28 0 4%,transparent 4% 70%,#4adfff28 70%);mix-blend-mode:screen}
.tt-effect-grain:after{background-image:radial-gradient(#ffffff35 .5px,transparent .8px);background-size:4px 4px;opacity:.3}
.tt-effect-vignette:after{box-shadow:inset 0 0 60px 18px #000b}
.tt-effect-pixel [data-live-camera]{image-rendering:pixelated}
@media(max-height:700px){.tt-camera-fullscreen .tt-camera-stage{max-height:48vh!important}.tt-camera-fullscreen .tt-camera-chip{padding:5px 8px}.tt-camera-fullscreen .tt-camera-bottom{padding:2px 0}}

function showPlus(){flow('Start something new','<button class="tt-pro-action" data-go="contact">＋ Add number and name</button><button class="tt-pro-action" data-go="pick">▦ Choose from contacts</button><button class="tt-pro-action" data-go="group">＋ Create groups</button><p class="tt-pro-muted">Contacts and groups are saved on this device until the connected TalkTrick database services are fully configured.</p>',body=>body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const m=b.dataset.go; if(m==='contact')showContact();if(m==='pick')chooseContacts();if(m==='group')showGroupStep1();}));}
function showContact(){flow('Add number and name','<form id="tt-pro-contact"><input name="name" placeholder="Contact name" required><input name="phone" type="tel" placeholder="Phone number with country code" required><button class="tt-pro-action tt-pro-primary">Save contact</button></form><p class="tt-pro-muted">This saves a local contact entry. Finding registered TalkTrick users requires a secure server-side phone lookup.</p>',body=>$('#tt-pro-contact',body).onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),name=d.get('name').trim(),phone=d.get('phone').trim();const rows=get('contacts');if(rows.some(x=>x.phone===phone)){alert('That number is already saved.');return;}rows.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,phone});put('contacts',rows);closeFlow();showLocalContacts();});}
async function chooseContacts(){if(!('contacts' in navigator&&navigator.contacts&&navigator.contacts.select)){flow('Choose from contacts','<p class="tt-pro-muted">This browser does not support the Contacts Picker. On a supported mobile browser, open this option again and allow access to choose contacts. You can also add a number manually.</p><button class="tt-pro-action tt-pro-primary" data-manual>Add number and name</button>',body=>body.querySelector('[data-manual]').onclick=showContact);return;}try{const found=await navigator.contacts.select(['name','tel'],{multiple:true});const rows=get('contacts');for(const c of found){const name=(c.name||[])[0]||'Contact';for(const phone of (c.tel||[])){if(!rows.some(x=>x.phone===phone))rows.push({id:String(Date.now())+Math.random(),name,phone});}}put('contacts',rows);flow('Contacts added','<p>Added '+found.length+' selected contact(s) to your local TalkTrick contacts.</p><p class="tt-pro-muted">Registered-user matching and invites need the secure server service.</p><button class="tt-pro-action tt-pro-primary" data-done>Done</button>',body=>body.querySelector('[data-done]').onclick=()=>{closeFlow();showLocalContacts()});}catch(err){if(err?.name!=='AbortError')flow('Contacts unavailable','<p class="tt-pro-muted">Contact access was cancelled or denied. You can still add a number manually.</p><button class="tt-pro-action tt-pro-primary" data-manual>Add number and name</button>',body=>body.querySelector('[data-manual]').onclick=showContact)}}

function showGroupStep3(){const contacts=get('contacts');flow('Participants · 3 of 3', (contacts.length?contacts.map(c=>'<label class="tt-pro-row"><input type="checkbox" data-member="'+safe(c.id)+'"> <span style="flex:1"><strong>'+safe(c.name)+'</strong><div class="tt-pro-muted">'+safe(c.phone)+'</div></span></label>').join(''):'<p class="tt-pro-muted">You have no saved contacts yet. You can create the group now and add participants later.</p>')+'<button class="tt-pro-action tt-pro-primary" data-create>Create group</button>',body=>body.querySelector('[data-create]').onclick=()=>{const ids=[...body.querySelectorAll('[data-member]:checked')].map(x=>x.dataset.member);const contacts=get('contacts');const members=contacts.filter(c=>ids.includes(c.id));const groups=get('groups');const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:groupDraft.name,description:groupDraft.description,members,admin:'local-creator',settings:groupDraft.settings||{adminOnly:true,approveNewMembers:true},createdAt:new Date().toISOString()};groups.unshift(item);put('groups',groups);closeFlow();showGroups();});}

 const list=groups.length?groups.map(g=>'<div class="tt-pro-row"><div style="width:38px;height:38px;border-radius:13px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800">'+safe(g.name.slice(0,1).toUpperCase())+'</div><div style="flex:1"><strong>'+safe(g.name)+'</strong><div class="tt-pro-muted">'+safe(g.members.length)+' selected participant(s) · Admin: you</div><div class="tt-pro-muted">'+safe(g.description)+'</div></div><button data-group="'+safe(g.id)+'" style="border:0;background:#ede9fe;color:#6d28d9;padding:8px;border-radius:10px">Open</button></div>').join(''):'<p class="tt-pro-muted">No groups created yet.</p>';
 flow('Your groups',list+'<button class="tt-pro-action tt-pro-primary" data-new>＋ Create group</button>',body=>{
  body.querySelector('[data-new]').onclick=showGroupStep1;
  body.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{
   const g=get('groups').find(x=>x.id===b.dataset.group); if(!g)return;
   const settingsHtml='<p class="tt-pro-muted">Creator/admin: you</p><p class="tt-pro-muted">Only admins edit info: '+(g.settings.adminOnly?'On':'Off')+'</p><p class="tt-pro-muted">Approve new members: '+(g.settings.approveNewMembers?'On':'Off')+'</p><p class="tt-pro-muted">These settings are stored locally until group services are connected.</p><button class="tt-pro-action tt-pro-primary" data-back>Back</button>';
   flow(g.name,'<p>'+safe(g.description||'No group description.')+'</p><p class="tt-pro-muted">Group preview only: real shared group messaging requires server-side group/conversation tables and RLS policies.</p><button class="tt-pro-action" data-settings>Group settings</button><button class="tt-pro-action tt-pro-primary" data-done>Done</button>',x=>{
    x.querySelector('[data-done]').onclick=()=>closeFlow();
    x.querySelector('[data-settings]').onclick=()=>flow('Group settings',settingsHtml,y=>y.querySelector('[data-back]').onclick=showGroups);
   });
  });
 });
}
function addGateClickHandler(){
 const isChatTarget=(target)=>{
   const b=target&&target.closest?target.closest('button,[role="button"]'):null;
   if(!b||b.closest('#tt-phone-gate')||b.closest('#tt-pro-flow'))return false;
   const text=(b.innerText||b.textContent||'').replace(/\s+/g,' ').trim();
   return /^(Chat|Chats)$/i.test(text) || (/^Chats$/i.test(text));
 };
 const requireSignIn=(e)=>{
   if(!isChatTarget(e.target))return;
   const existingGate=document.querySelector('#tt-phone-gate');
   if(existingGate && existingGate.style.display==='flex'){
     e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();return;
   }
   const acc=window.talktrickAccount;
   let session=null;
   try{session=acc&&acc.getSession&&acc.getSession();}catch(_){}
   if(session&&typeof session.then==='function')session=null;
   if(session?.user)return;
   e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
   // Hide the app root in the same event turn to prevent even a one-frame chat-list flash.
   document.body.classList.add('tt-phone-gate-open');
   openPhoneGate();
 };
 // Pointer-down catches the tap before React's click handler can change the selected screen.
 document.addEventListener('pointerdown',requireSignIn,true);
 document.addEventListener('touchstart',requireSignIn,{capture:true,passive:false});
 document.addEventListener('click',requireSignIn,true);
}
function wirePlus(){document.addEventListener('click',e=>{const b=e.target.closest('.tt-chat-plus');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();showPlus();},true);}
function addNavigationShortcut(){const observer=new MutationObserver(()=>{if($('#tt-phone-gate')&&!$('#tt-pro-groups-shortcut'))return;const headings=[...document.querySelectorAll('h1,h2,h3')];const chats=headings.find(h=>/^Chats$/i.test(h.textContent.trim()));if(chats&&!$('#tt-pro-groups-shortcut')){const b=document.createElement('button');b.id='tt-pro-groups-shortcut';b.textContent='Groups';b.style.cssText='border:0;border-radius:10px;padding:7px 10px;background:#ede9fe;color:#6d28d9;font:700 12px system-ui';b.onclick=showGroups;chats.parentElement?.appendChild(b);}});observer.observe(document.documentElement,{childList:true,subtree:true});}
function init(){ensurePhoneGate();addGateClickHandler();wirePlus();addNavigationShortcut();
 // Required entry flow: show sign-in immediately on first app load, not only after Chat is tapped.
 document.body.classList.add('tt-phone-gate-open');
 openPhoneGate();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<style id="tt-profile-update-style">

#tt-profile-overlay{position:fixed;inset:0;z-index:100020;background:#0b0b14;color:#fff;display:none;overflow:auto;font-family:system-ui,-apple-system,sans-serif}
#tt-profile-overlay *{box-sizing:border-box}#tt-profile-overlay .ttp-head{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #29283a;position:sticky;top:0;background:#0b0b14;z-index:2}#tt-profile-overlay .ttp-back{font-size:25px;background:none;color:white;border:0;padding:4px 8px}#tt-profile-overlay .ttp-wrap{max-width:560px;margin:auto;padding:0 16px 28px}#tt-profile-overlay .ttp-cover{height:170px;margin:18px 0 0;border-radius:16px;background:linear-gradient(135deg,#5022a8,#2866d8 55%,#f08a34);position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:flex-end;padding:12px}#tt-profile-overlay .ttp-avatar{width:108px;height:108px;border-radius:50%;border:4px solid #0b0b14;background:#28243d;object-fit:cover;position:relative;margin-top:-52px;margin-left:18px}#tt-profile-overlay .ttp-row{display:flex;align-items:end;gap:12px}#tt-profile-overlay .ttp-fields{padding-top:20px;display:grid;gap:15px}#tt-profile-overlay label{display:grid;gap:7px;color:#c8c5d8;font-size:13px}#tt-profile-overlay input,#tt-profile-overlay textarea{width:100%;background:#171625;border:1px solid #38354e;border-radius:11px;padding:12px;color:#fff;outline:none}#tt-profile-overlay textarea{min-height:90px;resize:vertical}#tt-profile-overlay .ttp-btn{border:0;border-radius:11px;padding:11px 14px;background:#6d45d8;color:white;font-weight:700}#tt-profile-overlay .ttp-secondary{background:#252337;border:1px solid #45415b}#tt-profile-overlay .ttp-muted{font-size:12px;color:#aaa6bd;margin-top:4px}

<div id="tt-profile-overlay" aria-label="TalkTrick profile">
 <div class="ttp-head"><button class="ttp-back" id="ttp-back" aria-label="Back">‹</button><strong id="ttp-title">Profile</strong><span style="flex:1"></span><button class="ttp-btn" id="ttp-edit">Edit</button></div>
 <div class="ttp-wrap"><div id="ttp-cover" class="ttp-cover"><button id="ttp-cover-upload" class="ttp-btn ttp-secondary" style="display:none">Change cover</button></div>
 <div class="ttp-row"><img id="ttp-avatar" class="ttp-avatar" alt="Profile picture" src=""><button id="ttp-avatar-upload" class="ttp-btn ttp-secondary" style="display:none">Change photo</button></div>
 <div id="ttp-view" class="ttp-fields"><div><h2 id="ttp-view-name" style="font-size:24px;font-weight:800">Your name</h2><div id="ttp-view-username" style="color:#b5a2ff">@username</div></div><div><div style="font-size:12px;color:#aaa6bd;margin-bottom:5px">DESCRIPTION</div><div id="ttp-view-description">Add a description about yourself.</div></div><div style="background:#171625;border:1px solid #38354e;padding:13px;border-radius:12px"><div style="font-size:12px;color:#aaa6bd">PHONE NUMBER</div><div id="ttp-view-phone" style="margin-top:5px">Not verified</div><div id="ttp-phone-verified" class="ttp-muted">Phone verification status depends on account authentication.</div></div></div>
 <form id="ttp-form" class="ttp-fields" style="display:none"><label>Full name<input id="ttp-name" maxlength="80" required placeholder="Your name"></label><label>Username<input id="ttp-username" maxlength="24" pattern="[A-Za-z0-9_.]{3,24}" required placeholder="username"><span class="ttp-muted">3–24 characters: letters, numbers, underscore or dot.</span></label><label>Description<textarea id="ttp-description" maxlength="300" placeholder="Write a short description"></textarea></label><div class="ttp-muted">Profile and cover images are saved on this device in this version. Cross-device image sync needs storage configured in Supabase.</div><button class="ttp-btn" type="submit">Save profile</button><button class="ttp-btn ttp-secondary" type="button" id="ttp-cancel">Cancel</button></form>
 <input id="ttp-cover-file" type="file" accept="image/*" hidden><input id="ttp-avatar-file" type="file" accept="image/*" hidden>
 </div></div>
<script id="tt-profile-update-script">
(()=>{'use strict';const $=s=>document.querySelector(s);const overlay=$('#tt-profile-overlay');if(!overlay)return;const storeKey='talktrick_profile_v1';let previousDisplay='';let data={name:'',username:'',description:'',phone:'',avatar:'',cover:''};try{data={...data,...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch(_){}
function show(){previousDisplay='';const root=document.querySelector('#root')||document.querySelector('[data-reactroot]');if(root){previousDisplay=root.style.display;root.dataset.ttpPreviousDisplay=previousDisplay;}render();overlay.style.display='block';document.body.style.overflow='hidden'}function hide(){overlay.style.display='none';document.body.style.overflow='';}
function render(){ $('#ttp-view-name').textContent=data.name||'Your name';$('#ttp-view-username').textContent=data.username?'@'+data.username.replace(/^@/,''):'@username';$('#ttp-view-description').textContent=data.description||'Add a description about yourself.';$('#ttp-view-phone').textContent=data.phone||'Not verified';$('#ttp-avatar').src=data.avatar||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#29243e"/><circle cx="50" cy="37" r="19" fill="#a69ac9"/><path d="M15 100c2-25 16-37 35-37s33 12 35 37" fill="#a69ac9"/></svg>');$('#ttp-cover').style.backgroundImage=data.cover?'url("'+data.cover+'")':'linear-gradient(135deg,#5022a8,#2866d8 55%,#f08a34)';$('#ttp-name').value=data.name||'';$('#ttp-username').value=(data.username||'').replace(/^@/,'');$('#ttp-description').value=data.description||'';}
function edit(){ $('#ttp-view').style.display='none';$('#ttp-form').style.display='grid';$('#ttp-edit').style.display='none';$('#ttp-cover-upload').style.display='inline-block';$('#ttp-avatar-upload').style.display='inline-block';}
function stopEdit(){ $('#ttp-view').style.display='grid';$('#ttp-form').style.display='none';$('#ttp-edit').style.display='inline-block';$('#ttp-cover-upload').style.display='none';$('#ttp-avatar-upload').style.display='none';}
$('#ttp-edit').onclick=edit;$('#ttp-cancel').onclick=()=>{render();stopEdit()};$('#ttp-back').onclick=hide;$('#ttp-form').onsubmit=e=>{e.preventDefault();data.name=$('#ttp-name').value.trim();data.username=$('#ttp-username').value.trim().replace(/^@/,'');data.description=$('#ttp-description').value.trim();try{localStorage.setItem(storeKey,JSON.stringify(data));}catch(_){alert('Could not save profile on this device. Try smaller images.');return;}render();stopEdit();};
$('#ttp-cover-upload').onclick=()=>$('#ttp-cover-file').click();$('#ttp-avatar-upload').onclick=()=>$('#ttp-avatar-file').click();function readFile(input,key){input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;if(f.size>3*1024*1024){alert('Please choose an image smaller than 3 MB.');input.value='';return;}const r=new FileReader();r.onload=()=>{data[key]=r.result;try{localStorage.setItem(storeKey,JSON.stringify(data));}catch(_){alert('Image is too large to save on this device.');data[key]='';return;}render();};r.readAsDataURL(f)}}readFile($('#ttp-cover-file'),'cover');readFile($('#ttp-avatar-file'),'avatar');
// Profile access is intentionally routed through Settings/Account rather than the home-page icon.
function addAccountEntry(){const nodes=[...document.querySelectorAll('button,[role="button"],a')];for(const n of nodes){if(n.dataset.ttpBound)continue;const t=(n.innerText||n.textContent||'').replace(/\s+/g,' ').trim();if(/^Profile$/i.test(t)||/^Account(?:\s*[·-]\s*Profile)?$/i.test(t)){n.dataset.ttpBound='1';n.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();show()},true);}}
 const settings=[...document.querySelectorAll('h1,h2,h3,div,span,button,[role="button"]')].find(n=>n.children.length<3&&/^Settings$/i.test((n.textContent||'').replace(/\s+/g,' ').trim()));if(settings){const container=settings.parentElement||settings;if(!container.querySelector('[data-ttp-account-entry]')){const b=document.createElement('button');b.dataset.ttpAccountEntry='1';b.textContent='Account';b.style.cssText='display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;background:#211d35;color:#fff;border:1px solid #3d355a;font:600 14px system-ui';b.onclick=e=>{e.preventDefault();show()};container.appendChild(b);}}}
const mo=new MutationObserver(addAccountEntry);mo.observe(document.documentElement,{subtree:true,childList:true});addAccountEntry();window.talktrickOpenProfile=show;
})();
</script>
